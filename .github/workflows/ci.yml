name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
          cache: true

      - name: Test Go
        run: go test ./...

      - name: Vet Go
        run: go vet ./...

      - name: Build Go
        run: go build ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile MCP server
        run: python -m py_compile mcp/server.py mcp/test_server.py

      - name: Test MCP server command construction
        run: python mcp/test_server.py
